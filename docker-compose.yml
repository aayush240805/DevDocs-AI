services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
      POSTGRES_USER: ${POSTGRES_USER:-devdocs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devdocs_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devdocs_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devdocs_user} -d ${POSTGRES_DB:-devdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdocs_pgdata:
